<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedie Slot - PIXI.js Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50;
            font-family: Arial, sans-serif;
        }
        
        #game-container {
            border: 2px solid #34495e;
            border-radius: 8px;
            background-color: #ecf0f1;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        canvas {
            display: block;
            border-radius: 4px;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 600px;
            width: 800px;
            color: #34495e;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="loading">Loading Game...</div>
        <!-- PIXI.js canvas will be added here by TypeScript -->
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
